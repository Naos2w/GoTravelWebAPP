    <style>
      /* === Apple Human Interface Guideline & iOS 27 Liquid Glass System === */
      :root {
        color-scheme: light;
        --ns-canvas: #F5F6F8;
        --ns-surface: #FFFFFF;
        --ns-subtle: #F0F2F5;
        --ns-ink: #1A1D23;
        --ns-ink-muted: #68707D;
        --ns-blue-rgb: 59 107 155;
        --ns-green-rgb: 74 124 100;
        --ns-amber-rgb: 181 123 69;
        --ns-red-rgb: 178 80 82;
        --ns-indigo-rgb: 98 101 150;

        --radius-xs: 10px;
        --radius-sm: 14px;
        --radius-md: 20px;
        --radius-lg: 28px;
        --radius-xl: 40px;
        --radius-2xl: 56px;

        --shadow-xs: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
        --shadow-sm: 0 2px 8px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
        --shadow-md: 0 4px 14px rgba(0,0,0,0.07), 0 2px 6px rgba(0,0,0,0.04);
        --shadow-lg: 0 10px 30px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.04);
        --shadow-xl: 0 20px 50px rgba(0,0,0,0.10), 0 8px 16px rgba(0,0,0,0.05);

        --glass-light: rgba(255, 255, 255, 0.82);
        --glass-dark: rgba(255, 255, 255, 0.05);
        --glass-border-light: rgba(255, 255, 255, 0.6);
        --glass-border-dark: rgba(255, 255, 255, 0.12);
      }
      .dark {
        color-scheme: dark;
        --ns-canvas: #0B0D11;
        --ns-surface: #14171F;
        --ns-subtle: #1B1F2A;
        --ns-ink: #ECEFF4;
        --ns-ink-muted: #8B93A1;
        --ns-blue-rgb: 106 152 198;
        --ns-green-rgb: 111 163 138;
        --ns-amber-rgb: 207 160 110;
        --ns-red-rgb: 207 118 120;
        --ns-indigo-rgb: 139 142 192;
      }

      * { box-sizing: border-box; }
      
      html { scroll-behavior: smooth; }

      body {
        background-color: var(--ns-canvas);
        color: var(--ns-ink);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        transition: background-color 0.4s ease, color 0.4s ease;
      }
      .dark body {
        background-color: var(--ns-canvas);
        color: var(--ns-ink);
      }

      /* === Scrollbars === */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      .custom-scrollbar::-webkit-scrollbar { width: 3px; height: 3px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.10);
        border-radius: 99px;
      }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.10);
      }
      .custom-thin-scrollbar::-webkit-scrollbar { height: 2px; }
      .custom-thin-scrollbar::-webkit-scrollbar-track { background: rgba(0,0,0,0.02); }
      .custom-thin-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(59, 107, 155, 0.25);
        border-radius: 99px;
      }

      /* === Keyframes === */
      @keyframes pulse-soft {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .animate-pulse-soft { animation: pulse-soft 2s infinite ease-in-out; }

      @keyframes slide-up {
        from { opacity: 0; transform: translateY(16px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-up { animation: slide-up 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      @keyframes scale-in {
        from { opacity: 0; transform: scale(0.94); }
        to   { opacity: 1; transform: scale(1); }
      }
      .animate-scale-in { animation: scale-in 0.35s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }
      .animate-dash { animation: dash 1s linear infinite; }

      @keyframes enter-slide-up-sm {
        from { opacity: 0; transform: translate3d(0, 10px, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes enter-zoom-sm {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: scale(1); }
      }
      .animate-in.slide-in-from-bottom-2,
      .animate-in.slide-in-from-bottom-3 {
        animation: enter-slide-up-sm 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .animate-in.zoom-in-95 {
        animation: enter-zoom-sm 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes tab-slide-from-right {
        from { opacity: 0; transform: translate3d(40px, 0, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      @keyframes tab-slide-from-left {
        from { opacity: 0; transform: translate3d(-40px, 0, 0); }
        to   { opacity: 1; transform: translate3d(0, 0, 0); }
      }
      .animate-tab-slide-right {
        animation: tab-slide-from-right 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }
      .animate-tab-slide-left {
        animation: tab-slide-from-left 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        will-change: transform, opacity;
      }

      /* === iOS 27 Liquid Glass Cards & Materials === */
      .ios27-card {
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(28px) saturate(190%);
        -webkit-backdrop-filter: blur(28px) saturate(190%);
        border: 1px solid rgba(15, 23, 42, 0.07);
        box-shadow: 0 8px 28px -6px rgba(15, 23, 42, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      }
      .dark .ios27-card {
        background: rgba(18, 20, 28, 0.72);
        backdrop-filter: blur(32px) saturate(200%);
        -webkit-backdrop-filter: blur(32px) saturate(200%);
        border: 1px solid rgba(255, 255, 255, 0.11);
        box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.14);
      }
      .dark .ios27-card:hover {
        border-color: rgba(255, 255, 255, 0.20);
        box-shadow: 0 20px 50px -8px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.20);
      }

      .ios27-subcard {
        background: rgba(15, 23, 42, 0.025);
        border: 1px solid rgba(15, 23, 42, 0.05);
      }
      .dark .ios27-subcard {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.07);
      }

      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }

      .aviation-grid-bg {
        background-image: radial-gradient(rgba(15, 23, 42, 0.06) 1px, transparent 1px);
        background-size: 16px 16px;
      }
      .dark .aviation-grid-bg {
        background-image: radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 16px 16px;
      }

      /* === Instagram / Threads Style Floating Dock === */
      .ios27-dock {
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(0, 0, 0, 0.08);
        box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.12);
      }
      .dark .ios27-dock {
        background: rgba(24, 24, 27, 0.80);
        backdrop-filter: blur(24px) saturate(180%);
        -webkit-backdrop-filter: blur(24px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 40px -6px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.10);
      }

      /* Instagram / Threads Style Selected Pill */
      .dock-pill-active {
        background: rgba(15, 23, 42, 0.08);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 2px 8px rgba(15, 23, 42, 0.06);
        transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, box-shadow 0.25s ease;
        will-change: transform;
      }
      .dark .dock-pill-active {
        background: rgba(255, 255, 255, 0.16);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 4px 12px rgba(0, 0, 0, 0.4);
      }
      .dock-pill-scrubbing {
        transition: transform 0.05s linear, background-color 0.2s ease, box-shadow 0.2s ease !important;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.95), 0 6px 16px rgba(15, 23, 42, 0.12);
      }
      .dark .dock-pill-scrubbing {
        background: rgba(255, 255, 255, 0.24);
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.38), 0 6px 20px rgba(0, 0, 0, 0.55);
      }

      /* Flat Indicator for desktop tabs */
      .ios27-dock-active {
        background: rgba(0, 122, 255, 0.10);
        border: 1px solid rgba(0, 122, 255, 0.20);
      }
      .dark .ios27-dock-active {
        background: rgba(0, 122, 255, 0.18);
        border: 1px solid rgba(0, 122, 255, 0.30);
      }

      .glass {
        background: var(--glass-light);
        backdrop-filter: saturate(180%) blur(20px);
        -webkit-backdrop-filter: saturate(180%) blur(20px);
        border: 1px solid var(--glass-border-light);
      }
      .dark .glass {
        background: var(--glass-dark);
        border-color: var(--glass-border-dark);
      }

      /* === Apple Segmented Control === */
      .apple-segment {
        background: rgba(116,116,128,0.12);
        border-radius: var(--radius-sm);
        padding: 2px;
      }
      .dark .apple-segment {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .apple-segment-item {
        border-radius: calc(var(--radius-sm) - 2px);
        padding: 5px 14px;
        font-size: 11px;
        font-weight: 800;
        transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .apple-segment-item.active {
        background: #ffffff;
        box-shadow: var(--shadow-sm);
        color: #1d1d1f;
      }
      .dark .apple-segment-item.active {
        background: rgba(255, 255, 255, 0.18);
        color: #ffffff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 16px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      }

      /* === Leaflet Overrides & Dark Mode Basemap === */
      .leaflet-container {
        background-color: #f2f2f7 !important;
        font-family: inherit;
      }
      .dark .leaflet-container {
        background-color: #12161f !important;
      }
      .leaflet-tile {
        filter: saturate(85%) contrast(98%);
        transition: filter 0.3s ease;
      }
      .dark .leaflet-tile {
        filter: invert(92%) hue-rotate(195deg) saturate(28%) brightness(88%) contrast(96%);
      }
      .dark .leaflet-control-attribution {
        background: rgba(12, 14, 20, 0.75) !important;
        backdrop-filter: blur(8px);
        color: #94a3b8 !important;
      }
      .dark .leaflet-control-attribution a {
        color: #60a5fa !important;
      }
      .custom-leaflet-marker { background: transparent; border: none; }
      .leaflet-popup-content-wrapper {
        border-radius: var(--radius-lg) !important;
        padding: 4px !important;
        box-shadow: var(--shadow-xl) !important;
        background: rgba(255,255,255,0.96) !important;
        backdrop-filter: blur(20px) !important;
        border: 1px solid rgba(0,0,0,0.06) !important;
      }
      .dark .leaflet-popup-content-wrapper {
        background: rgba(18,20,28,0.95) !important;
        border-color: rgba(255,255,255,0.12) !important;
      }
      .dark .leaflet-popup-tip {
        background: rgba(18,20,28,0.95) !important;
      }
      .leaflet-popup-content { margin: 8px !important; }

      /* Google Maps navigation button inside Leaflet popup */
      .leaflet-popup-content .gmap-nav-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        margin-top: 8px;
        padding: 6px 0;
        background-color: #4285F4 !important;
        color: #ffffff !important;
        border-radius: 8px;
        font-size: 10px;
        font-weight: 900;
        text-decoration: none !important;
        transition: opacity 0.15s;
      }
      .leaflet-popup-content .gmap-nav-btn:hover {
        background-color: #3367D6 !important;
        color: #ffffff !important;
      }
      /* Dark mode: deeper tone */
      .dark .leaflet-popup-content .gmap-nav-btn {
        background-color: #1a56db !important;
        color: #e8eeff !important;
      }
      .dark .leaflet-popup-content .gmap-nav-btn:hover {
        background-color: #1245b8 !important;
      }
      /* Hide nav button on desktop (md = 768px) */
      @media (min-width: 768px) {
        .leaflet-popup-content .gmap-nav-btn { display: none !important; }
      }
    </style>

        "imports": {
          "react": "https://esm.sh/react@^19.2.3",

  </head>
